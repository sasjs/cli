version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    allow:
      - dependency-type: "production"

  # The workflows pin their actions to a commit SHA - that is what the scorecard's
  # Pinned-Dependencies check rewards, and it makes a compromised tag useless - so
  # something has to move those pins, or they rot.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
