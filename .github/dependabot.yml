version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    allow:
      - dependency-type: "production"
    # chalk 5+ and ora 6+ publish an ES module only - `"type": "module"`, an
    # `exports` map and no CommonJS build - and this package compiles to
    # CommonJS. Node resolves an ES module from require() from 22.12, which the
    # CLI's own engines covers, but not the VS Code extension host: the
    # extension requires `@sasjs/cli/build/commands` in-process and supports
    # VS Code 1.96+, whose host is Node 20.18, where require() of either major
    # throws ERR_REQUIRE_ESM.
    #
    # Drop these two entries once the extension's `engines.vscode` reaches
    # ^1.101.0 - the first release whose extension host runs Node 22 - and take
    # the bumps then. The interop that makes them work is in #1544 and #1547.
    ignore:
      - dependency-name: "chalk"
        versions: [">=5.0.0"]
      - dependency-name: "ora"
        versions: [">=6.0.0"]

  # The workflows pin their actions to a commit SHA - that is what the scorecard's
  # Pinned-Dependencies check rewards, and it makes a compromised tag useless - so
  # something has to move those pins, or they rot.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # one PR a week carrying every bump, rather than the limit deciding which
    # actions stay current
    groups:
      actions:
        patterns:
          - '*'
