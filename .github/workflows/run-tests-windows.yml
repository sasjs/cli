# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Run mocked tests on Windows

on:
  pull_request:

# a newer commit on the same pull request supersedes the run in flight, so a
# stale push does not hold a Windows runner for a suite nobody will read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# the same default as run-tests.yml: this workflow only reads the repository,
# so the token carries no write scope
permissions:
  contents: read

env:
  # the same pin as run-tests.yml and npmpublish.yml, for the same reason: the
  # tarball a pull request validates is packed with the npm that publishes it
  NPM_VERSION: 12.2.0

jobs:
  # Named `windows`, not `test`: the Linux workflow's fan-in job reports
  # "test (22)", and until this was renamed both jobs produced a check run with
  # that name on every pull request.
  windows:
    runs-on: windows-latest
    # Windows runs the slowest leg of the suite and starts a server; a hung
    # start must fail here rather than hold a runner for the 360-minute default
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Update npm
        # The same pin as the Update npm step in npmpublish.yml, for the same
        # reason as run-tests.yml: Test Package Install packs the tarball a pull
        # request validates, and the release job packs and publishes it. Bump
        # both together.
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - uses: ssciwr/doxygen-install@fa3e94d34131d3990b6b8ba939ab982964aa3758 # v2.0.3
        with:
          version: '1.9.3'

      - name: Check doxygen version
        run: doxygen -v

      - name: Create .env file for sasjs/server
        run: |
          echo RUN_TIMES=js >> .env
          echo NODE_PATH=node >> .env

      - name: Download sasjs/server package from GitHub
        shell: bash
        # `releases/latest/download/windows.zip` follows whatever release is
        # newest, and a release can be published with no assets at all: v7.24.3
        # was, so that URL 302s to a 404 whose body was saved as windows.zip and
        # the next step reported "end of central directory record signature not
        # found" - a message about a zip, for a file that was never one. No
        # release was ever meant here that carried no binaries, so the newest
        # release that actually publishes the asset is resolved and named.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # the token is here for rate limits, not access: the repository is
          # public, so an unauthenticated call is still a correct one
          args=(-fsSL -H "accept: application/vnd.github+json")
          if [ -n "${GH_TOKEN:-}" ]; then
            args+=(-H "authorization: Bearer ${GH_TOKEN}")
          fi
          tag=$(curl "${args[@]}" \
            "https://api.github.com/repos/sasjs/server/releases?per_page=30" |
            node -e '
              let body = ""
              process.stdin.on("data", (chunk) => (body += chunk))
              process.stdin.on("end", () => {
                const releases = JSON.parse(body)
                const carrying = releases.find((release) =>
                  (release.assets || []).some(
                    (asset) => asset.name === "windows.zip"
                  )
                )
                if (!carrying) {
                  console.error("No sasjs/server release publishes windows.zip")
                  process.exit(1)
                }
                console.log(carrying.tag_name)
              })
            ')
          echo "Using sasjs/server ${tag}"
          curl -fsSL \
            "https://github.com/sasjs/server/releases/download/${tag}/windows.zip" \
            --output windows.zip

      - name: Unzip downloaded package
        shell: bash
        # a download served under a `.zip` name is not always one, so the bytes
        # are checked here rather than left to extract-zip's own wording
        run: |
          set -euo pipefail
          signature=$(head -c 2 windows.zip | od -An -tx1 | tr -d ' \n')
          if [ "${signature}" != "504b" ]; then
            echo "::error::windows.zip is not a zip archive: it begins with the bytes ${signature}, where a zip begins 504b (\"PK\")."
            exit 1
          fi
          npx extract-zip windows.zip

      - name: Start sasjs server in background
        run: START .\api-win.exe >> run-sasjs-server.txt

      - name: Install dependencies
        run: |
          npm config set registry http://registry.npmjs.org
          npm ci

      - name: Check code style
        run: npm run lint

      - name: Install rimraf
        run: npm i -g rimraf

      - name: Build Project
        run: npm run build

      - name: Test Package Install
        run: |
          npm version "5.0.0" --no-git-tag-version
          npm pack
          npm install -g ./sasjs-cli-5.0.0.tgz
          sasjs v

      - name: npm prefix for user
        run: echo prefix=C:\npm\prefix >> ~\.npmrc

      - name: Sasjs Server started
        run: cat run-sasjs-server.txt

      - name: Run mocked tests
        run: npm run test:mocked
        env:
          CI: true
          CLIENT: ${{ secrets.CLIENT }}
          SECRET: ${{ secrets.SECRET }}
          SAS_USERNAME: ${{ secrets.SAS_USERNAME }}
          SAS_PASSWORD: ${{ secrets.SAS_PASSWORD }}
          VIYA_SERVER_URL: ${{ secrets.VIYA_SERVER_URL }}
          SAS9_SERVER_URL: ${{ secrets.SAS9_SERVER_URL }}
          SASJS_SERVER_URL: 'http://localhost:5000'
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
