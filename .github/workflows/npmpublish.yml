# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://help.github.com/actions/language-and-framework-guides/publishing-nodejs-packages

name: SASjs CLI Deploy

on:
  push:
    branches:
      - main

permissions:
  id-token: write  # https://docs.npmjs.com/trusted-publishers
  contents: write  # semantic-release needs to push tags and create releases
  issues: write  # semantic-release comments on issues on failure

jobs:
  release:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Audit for vulnerabilities
        run: npm audit --omit=dev --audit-level=low

      - name: Install the release tooling
        # Its own locked tree, installed here rather than resolved from npx:
        # that pins the resolved versions and their integrity hashes, and this
        # runs with publish credentials. Kept out of the package's own
        # dependencies so its unfixable advisories stay out of the package's
        # `npm audit`.
        run: npm ci --prefix release --ignore-scripts

      - name: Semantic Release
        run: release/node_modules/.bin/semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
