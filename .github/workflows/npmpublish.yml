name: SASjs CLI Deploy

# Publishes the version the release names, and only that.
#
# This file keeps its name because npm's trusted publisher is registered against
# the workflow that actually runs `npm publish` - the registry validates the OIDC
# `job_workflow_ref` claim - and renaming it would break publishing until the
# publisher is re-registered. Keeping the tag in release.yml means neither job
# holds the other's permission: the release job never sees id-token, and this one
# never sees contents: write.
#
# A `release: published` trigger would not work and would fail silently: a release
# created with the pipeline's own GITHUB_TOKEN fires no events, because GitHub
# suppresses them to stop recursion. workflow_run is not suppressed, so publishing
# is chained off the Release workflow finishing.
#
# Nothing is committed. The tag is the version; it is stamped into the working
# tree because npm reads package.json, and the tree is thrown away.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  # a publish that failed can be retried: the release event fires once, and
  # re-creating the release to republish is exactly the state to avoid
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Release tag to publish. Required when dispatched; when this runs from
          the Release workflow, leave it blank and the tag that run created is
          used. Must be on main.
        required: false
        default: ''
      republish:
        description: Publish even when the registry already serves this version
        required: false
        type: boolean
        default: false

# read-only by default; the release job asks for the identity it publishes with,
# so a workflow that stops needing a permission cannot keep it by accident
permissions: read-all

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: |
      github.repository == 'sasjs/cli' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')
    permissions:
      contents: read
      id-token: write # https://docs.npmjs.com/trusted-publishers

    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the tag is how this workflow learns what to publish: the release run
          # created it at the commit it released
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the tag
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ inputs.tag }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # there is deliberately no `github.event.release` fallback: neither
          # trigger is `release`, and there cannot be one (see the header)
          tag="$REQUESTED"

          if [ -z "$tag" ] && [ "$EVENT" = "workflow_run" ]; then
            # the tag the release run just created, at the commit it released
            tag="$(git tag --points-at "$SHA" --sort=-v:refname | head -1)"
            if [ -z "$tag" ]; then
              echo "::notice::no tag at $SHA - that release had nothing to publish"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if [ -z "$tag" ]; then
            echo "::error::no tag - dispatch this with the tag to publish"
            exit 1
          fi

          # a dispatch can name any tag in the repository; only one cut from a
          # commit on the default branch is a release this pipeline made
          git fetch --quiet --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor "${tag}^{commit}" refs/remotes/origin/main; then
            echo "::error::$tag is not on main - refusing to publish it"
            exit 1
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "publishing $tag (version ${tag#v})"

      - name: Check out the tag
        if: steps.tag.outputs.skip != 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: git checkout -q "refs/tags/$TAG"

      - name: Use Node.js ${{ matrix.node-version }}
        if: steps.tag.outputs.skip != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          registry-url: https://registry.npmjs.org

      # Node 22 ships npm 10.x - OIDC trusted publishing needs npm >= 11.5.1.
      # Pinned rather than @latest so the toolchain that publishes the package is
      # the one this commit was reviewed with: @latest would adopt a new npm major
      # into the release path without a commit here. Bump it deliberately.
      - name: Update npm
        if: steps.tag.outputs.skip != 'true'
        run: npm install -g npm@12.2.0

      - name: Install dependencies
        if: steps.tag.outputs.skip != 'true'
        run: npm ci

      # the version npm reads is the tag, stamped into the tree and not committed.
      # Before the build, while the tree is still clean enough for npm version to
      # accept it.
      - name: Stamp the version
        if: steps.tag.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build project
        if: steps.tag.outputs.skip != 'true'
        run: npm run build

      - name: Audit for vulnerabilities
        if: steps.tag.outputs.skip != 'true'
        run: npm audit --omit=dev --audit-level=low

      - name: The version is the tag's
        # prepublishOnly refuses the 0.0.0 placeholder, and the publish step below
        # re-enables it with --ignore-scripts=false, so that case is already
        # covered. This checks what prepublishOnly cannot see: that the version
        # npm is about to read is the tag's, not merely non-placeholder.
        if: steps.tag.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          stamped="$(node -p "require('./package.json').version")"
          echo "stamped $stamped, tag says $VERSION"
          if [ "$stamped" != "$VERSION" ]; then
            echo "::error::package.json states $stamped but the tag names $VERSION"
            exit 1
          fi

      - name: Already on the registry?
        id: existing
        if: steps.tag.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          REPUBLISH: ${{ inputs.republish }}
        run: |
          set -euo pipefail
          published="$(npm view "@sasjs/cli@${VERSION}" version --prefer-online 2>/dev/null || true)"
          if [ "$published" = "$VERSION" ] && [ "${REPUBLISH:-false}" != "true" ]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "$VERSION is already on the registry - nothing to publish"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm with trusted publisher
        if: steps.tag.outputs.skip != 'true' && steps.existing.outputs.already != 'true'
        # no NODE_AUTH_TOKEN: the OIDC token is exchanged for a short-lived
        # credential, so there is no long-lived secret in this repository.
        # --ignore-scripts=false re-enables this package's own prepublishOnly,
        # which .npmrc disables for every other command; nothing is installed at
        # publish time, so no dependency's script can run from it.
        run: npm publish --provenance --access public --ignore-scripts=false
