name: SASjs CLI Deploy

# Publishes the version the release names, and only that.
#
# This file keeps its name because npm's trusted publisher is registered against
# the workflow that actually runs `npm publish` - the registry validates the OIDC
# `job_workflow_ref` claim - and renaming it would break publishing until the
# publisher is re-registered. Keeping the tag in release.yml means neither job
# holds the other's permission: the release job never sees id-token, and this one
# never sees contents: write.
#
# A `release: published` trigger would not work and would fail silently: a release
# created with the pipeline's own GITHUB_TOKEN fires no events, because GitHub
# suppresses them to stop recursion. workflow_run is not suppressed, so publishing
# is chained off the Release workflow finishing.
#
# Nothing is committed. The tag is the version; it is stamped into the working
# tree because npm reads package.json, and the tree is thrown away. Which version,
# whether it may be published, and whether the registry already serves it are
# answered by `@sasjs/release --prepare-publish`, not by a shell block here: that
# logic was copied into each repository and each copy drifted.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  # a publish that failed can be retried: the release event fires once, and
  # re-creating the release to republish is exactly the state to avoid
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Release tag to publish. Required when dispatched; when this runs from
          the Release workflow, leave it blank and the tag that run created is
          used. Must be on main.
        required: false
        default: ''
      republish:
        description: Publish even when the registry already serves this version
        required: false
        type: boolean
        default: false

# read-only by default; the release job asks for the identity it publishes with,
# so a workflow that stops needing a permission cannot keep it by accident
permissions: read-all

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: |
      github.repository == 'sasjs/cli' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')
    permissions:
      contents: read
      id-token: write # https://docs.npmjs.com/trusted-publishers

    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Always main: a dispatch can name any ref, and the tag gate inside
          # --prepare-publish treats main as the branch a release must be on.
          # Publishing is from main or not at all, so the checkout says so rather
          # than inheriting the dispatcher's choice.
          ref: main
          # the tag is how this workflow learns what to publish: the release run
          # created it at the commit it released
          fetch-depth: 0
          persist-credentials: false

      # Discovery only: which tag did the release run cut, or did a dispatch name
      # one. What version that is, whether it may be published, and whether the
      # registry already serves it are decisions, and they are `--prepare-publish`'s.
      - name: Which tag is this run for?
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ inputs.tag }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # there is deliberately no `github.event.release` fallback: neither
          # trigger is `release`, and there cannot be one (see the header)
          tag="$REQUESTED"

          if [ -z "$tag" ] && [ "$EVENT" = "workflow_run" ]; then
            # the tag the release run just created, at the commit it released
            tag="$(git tag --points-at "$SHA" --sort=-v:refname | head -1)"
            if [ -z "$tag" ]; then
              # A shallow clone carries no tags, and the branch below would then
              # report a green publish that published nothing. Only a checkout
              # with the tags in it can say "that release cut no tag".
              if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
                echo "::error::this checkout is shallow, so the tag the release created cannot be seen - the job needs fetch-depth: 0"
                exit 1
              fi
              echo "::notice::no tag at $SHA - that release had nothing to publish"
              echo "tag=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if [ -z "$tag" ]; then
            echo "::error::no tag - dispatch this with the tag to publish"
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publishing from $tag"

      - name: Check out the tag
        if: steps.tag.outputs.tag != ''
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: git checkout -q "refs/tags/$TAG"

      - name: Use Node.js ${{ matrix.node-version }}
        if: steps.tag.outputs.tag != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          registry-url: https://registry.npmjs.org

      # Node 22 ships npm 10.x - OIDC trusted publishing needs npm >= 11.5.1.
      # Pinned rather than @latest so the toolchain that publishes the package is
      # the one this commit was reviewed with: @latest would adopt a new npm major
      # into the release path without a commit here. Bump it deliberately.
      - name: Update npm
        if: steps.tag.outputs.tag != ''
        run: npm install -g npm@12.2.0

      - name: Install dependencies
        if: steps.tag.outputs.tag != ''
        run: npm ci

      # The tool comes from the lockfile, so the bytes are pinned: `npx
      # @sasjs/release@x.y.z` would resolve whatever the registry served at
      # publish time, on the one job that can put a version on npm.
      #
      # It refuses a tag that is not an ancestor of main, stamps the tag's version
      # into package.json (npm reads the file, the tree is thrown away), and reports
      # `publish=false` when the registry already serves that version - which is a
      # re-run of a finished release, not a failure.
      - name: Stamp the version, and ask whether it is published
        id: publish
        if: steps.tag.outputs.tag != ''
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          REPUBLISH: ${{ inputs.republish }}
        run: |
          set -euo pipefail
          extra=()
          if [ "${REPUBLISH:-false}" = "true" ]; then extra+=(--republish); fi
          npx sasjs-release --prepare-publish --tag "$TAG" --branch main ${extra[@]+"${extra[@]}"} --output "$GITHUB_OUTPUT"

      - name: Build project
        if: steps.publish.outputs.publish == 'true'
        run: npm run build

      - name: Audit for vulnerabilities
        if: steps.publish.outputs.publish == 'true'
        run: npm audit --omit=dev --audit-level=low

      - name: Publish to npm with trusted publisher
        if: steps.publish.outputs.publish == 'true'
        # no NODE_AUTH_TOKEN: the OIDC token is exchanged for a short-lived
        # credential, so there is no long-lived secret in this repository.
        # --ignore-scripts=false re-enables this package's own prepublishOnly,
        # which .npmrc disables for every other command; nothing is installed at
        # publish time, so no dependency's script can run from it.
        run: npm publish --provenance --access public --ignore-scripts=false
