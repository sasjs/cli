# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://help.github.com/actions/language-and-framework-guides/publishing-nodejs-packages

name: SASjs CLI Deploy

on:
  push:
    branches:
      - main

permissions:
  id-token: write  # https://docs.npmjs.com/trusted-publishers
  contents: write  # semantic-release needs to push tags and create releases
  issues: write  # semantic-release comments on issues on failure

jobs:
  release:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0      # semantic-release needs full history + tags

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          registry-url: https://registry.npmjs.org

      # Node 22 ships npm 10.x - OIDC trusted publishing needs npm >= 11.5.1.
      # Pinned rather than @latest so the toolchain that publishes the package
      # is the one this commit was reviewed with: @latest would adopt a new npm
      # major into the release path without a commit here, which is the exposure
      # the locked release/ tree exists to avoid. 12.2.0 is what @latest
      # resolved to when this was pinned, so the release path is unchanged by
      # the pin - and it is the version sasjs/lint published 4.1.4 with, through
      # this same OIDC step. Bump it deliberately.
      # npm 12 requires node ^22.22.2 || ^24.15.0 || >=26.0.0, which
      # setup-node's `22` resolves above; re-check that floor on a bump.
      - name: Update npm
        run: npm install -g npm@12.2.0

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Audit for vulnerabilities
        run: npm audit --omit=dev --audit-level=low

      - name: Audit the release toolchain
        # Its own scope: the toolchain is not shipped, so it must not gate the
        # package, but it runs with publish credentials, so it must not be
        # invisible either. Fails on anything outside the named exemptions in
        # release/audit.mjs.
        run: node release/audit.mjs

      - name: Install the release tooling
        # Its own locked tree, installed here rather than resolved from npx:
        # that pins the resolved versions and their integrity hashes, and this
        # runs with publish credentials. Kept out of the package's own
        # dependencies so its unfixable advisories stay out of the package's
        # `npm audit`.
        run: npm ci --prefix release --ignore-scripts

      - name: Semantic Release
        run: release/node_modules/.bin/semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
