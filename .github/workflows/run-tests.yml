# Continuous integration for @sasjs/cli.
#
# The work is split across jobs so a run reports which phase failed and the
# phases run at the same time instead of one after another: lint, dependency
# audits, documentation coverage, build plus package smoke test, the mocked jest
# suite, and the server suite against a locally started @sasjs/server.
#
# `test` at the end is a fan-in that carries the name this workflow's single job
# used to report ("test (22)"), so a required status check on the base branch
# keeps resolving after the split.

name: Node.js CI

on:
  pull_request:

# a newer commit on the same pull request supersedes the run in flight
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # the versions a pull request validates and the release publishes with have to
  # be the same npm - see "Update npm" in npmpublish.yml
  NPM_VERSION: 12.2.0
  SERVER_VERSION: 3.6.2

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check code style
        run: npm run lint

      - name: Test the CI scripts
        # node's own runner: this needs no dependencies beyond the node the job
        # already sets up, and it runs in well under a second
        run: node --test .github/scripts/coverage-ratchet.test.mjs

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Update npm
        # audit behaviour is npm-version dependent, and the env comment above
        # says the npm a pull request validates with is the one the release
        # publishes with, so this job runs the same pin
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Install production dependencies
        # The production set resolves and installs on its own here, without the
        # dev tree. `npm ci` in the other jobs installs it too, so this is about
        # the shape a consumer gets rather than a second opinion - and note that
        # npm has no "fail on warning" mode, so install warnings stay warnings.
        run: npm ci --omit=dev --ignore-scripts


      - name: Check npm audit
        run: npm audit --omit=dev --audit-level=low

      - name: Install the release toolchain
        # The audit below reads the lockfile only, so drift between
        # release/package.json and release/package-lock.json is invisible to it -
        # the install is the check: it fails when they disagree. Running it here,
        # before the audit that inspects the locked tree, keeps the two in the
        # order a reader expects. Same step as sasjs/adapter's
        # build-unit-tests.yml.
        run: npm ci --prefix release --ignore-scripts

      - name: Audit the release toolchain
        # Its own scope: the toolchain is not shipped, so it must not gate the
        # package, but it runs with publish credentials, so it must not be
        # invisible either. Fails on anything outside the named exemptions in
        # release/audit.mjs. Reads the lockfile only, so it needs no install.
        run: node release/audit.mjs

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Compodoc
        # pinned: an unpinned install changes what renders the docs, and the
        # coverage threshold this step enforces, with no commit to review
        run: npm i -g @compodoc/compodoc@2.0.0

      - name: Generate development documentation and test level of documentation coverage
        run: npm run doc

  build-and-smoke:
    name: build-and-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Update npm
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Test Package Install
        # packs and installs the tarball a pull request validates; the release
        # job packs and publishes the same one
        run: |
          npm version "5.0.0" --no-git-tag-version
          npm pack
          npm install -g ./sasjs-cli-5.0.0.tgz
          sasjs v

      - name: Run smoke tests
        run: sh ./test.sh

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    # only this job writes: the coverage comment on the pull request.
    # actions: read is for the baseline artifact it downloads.
    permissions:
      contents: read
      actions: read
      pull-requests: write
      issues: write
    timeout-minutes: 30
    strategy:
      # the floor the package declares (engines >=22) and the next LTS, so a
      # forward-compatibility break shows up here rather than for a user
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Update npm
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Install Doxygen
        run: sudo apt-get install -y doxygen

      - name: Build Project
        run: npm run build

      - name: Test Package Install
        # Not decoration: src/commands/version/spec/version.spec.ts runs
        # `npm list -g @sasjs/cli` and parses the result, so the suite fails
        # without the CLI installed globally. The tarball packed here is the one
        # a user installs.
        run: |
          npm version "5.0.0" --no-git-tag-version
          npm pack
          npm install -g ./sasjs-cli-5.0.0.tgz

      # Mocked (*.spec.ts) tests. Node 22 produces the coverage summary the
      # ratchet reads; node 24 runs the same suite without coverage, as a
      # forward-compatibility check on the next LTS.
      #
      # The summary comes from jest itself rather than from a coverage-reporting
      # action. The ArtiomTr action checks the pull request's base branch out
      # into this workspace, and only switches back when it can name the branch
      # it started on; a `pull_request` run sits on a detached merge commit, so
      # the switch back is skipped and every later step of the job sees the base
      # tree. The ratchet step failed exactly that way with
      # `Cannot find module .../coverage-ratchet.mjs` (run 41109073336).
      - name: Run mocked tests with coverage
        if: matrix.node-version == 22
        run: npx jest --config=jest.config.js --silent --runInBand --ci --coverage

      - name: Run mocked tests
        if: matrix.node-version != 22
        run: npx jest --config=jest.config.js --silent --runInBand --ci

      - name: Find the coverage baseline
        id: coverage-baseline
        if: matrix.node-version == 22
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # The baseline this pull request is measured against, chosen in this
          # order and never by "whatever is newest":
          #
          # 1. the run for the base commit itself - the tree the pull request is
          #    diffed against;
          # 2. a run for a commit the base commit descends from, when the base
          #    commit has none (a stacked pull request, or a baseline run that
          #    has not finished yet). An ancestor is a tree this pull request
          #    extends, so the comparison cannot invent a pass out of someone
          #    else's later work, and the note in the comment names the commit;
          # 3. nothing - the job fails.
          #
          # Listed by workflow, not by artifact name: an unrelated workflow that
          # one day uploads a `coverage-summary` artifact is not a candidate.
          # `|| true`: this endpoint 404s until the workflow exists on the
          # default branch, which is exactly the state of the pull request that
          # introduces it - an empty list is handled below, a failed step is not.
          runs=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/coverage-baseline.yml/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.conclusion == "success") | "\(.head_sha) \(.id)"' \
            2>/dev/null || true)

          run_id=$(echo "$runs" | awk -v sha="$BASE_SHA" '$1 == sha { print $2 }' | head -1)
          source="the baseline published for the base commit ${BASE_SHA}"
          missing=fail

          if [ -z "$run_id" ]; then
            # every published baseline, newest first - not the first ten: main
            # can move many runs past the base commit of a stacked pull request
            for candidate in $(echo "$runs" | awk '{ print $1 }'); do
              # "ahead" means the base commit is ahead of the candidate, so the
              # candidate is an ancestor; "identical" is the same commit
              status=$(gh api \
                "repos/${GITHUB_REPOSITORY}/compare/${candidate}...${BASE_SHA}" \
                --jq '.status' 2>/dev/null || true)
              if [ "$status" = "ahead" ] || [ "$status" = "identical" ]; then
                run_id=$(echo "$runs" | awk -v sha="$candidate" '$1 == sha { print $2 }' | head -1)
                source="the baseline published for ${candidate}, the newest commit the base commit ${BASE_SHA} descends from"
                echo "::warning::No baseline was published for the base commit ${BASE_SHA}. Comparing against ${candidate}, which the base commit descends from."
                break
              fi
            done
          fi

          if [ -z "$run_id" ]; then
            # The pull request that introduces the mechanism has a base commit
            # with no baseline, and cannot get one until this lands. Proven by
            # the workflow file being absent at that commit, and by reading the
            # HTTP status rather than a pipeline's exit code - `gh api` fails on
            # a 404, so a shell that ran with `pipefail` would invert an exit-code
            # test here. The skip retires itself: once the workflow is on the
            # base branch the file is found and a missing baseline fails again.
            probe=$(gh api --include \
              "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/coverage-baseline.yml?ref=${BASE_SHA}" \
              2>/dev/null || true)
            status=$(printf '%s\n' "$probe" | awk 'NR == 1 { print $2 }')

            if [ "$status" = "404" ]; then
              missing=skip
              echo "::warning::The base commit ${BASE_SHA} predates the coverage-baseline workflow, so this pull request has nothing to compare against."
            fi
          fi

          echo "run-id=${run_id}" >> "$GITHUB_OUTPUT"
          echo "source=${source}" >> "$GITHUB_OUTPUT"
          echo "missing=${missing}" >> "$GITHUB_OUTPUT"

      - name: Download the coverage baseline
        # fails the job when there is nothing to download: a missing baseline is
        # a broken gate, and the step that notices should be this one rather
        # than a green tick with a warning buried in the log
        if: matrix.node-version == 22 && steps.coverage-baseline.outputs.run-id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh run download ${{ steps.coverage-baseline.outputs.run-id }}
          --name coverage-summary
          --dir coverage-base

      - name: Ratchet the coverage
        id: ratchet
        # continue-on-error so the comment below is posted either way; the
        # "Fail on a coverage regression" step turns the outcome into the job's
        # result. See the script's header for why the comparison is the gate.
        continue-on-error: true
        if: matrix.node-version == 22
        run: >-
          node .github/scripts/coverage-ratchet.mjs
          --head coverage/coverage-summary.json
          --base coverage-base/coverage-summary.json
          --markdown coverage-comment.md
          --missing-baseline ${{ steps.coverage-baseline.outputs.missing }}
          --note "Compared against ${{ steps.coverage-baseline.outputs.source }}."

      - name: Report the coverage
        # one comment per pull request, edited in place on each push
        if: matrix.node-version == 22 && hashFiles('coverage-comment.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          existing=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
            --jq '.[] | select(.body | startswith("<!-- coverage-ratchet -->")) | .id' | head -1)

          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" \
              -f body="$(cat coverage-comment.md)" > /dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -f body="$(cat coverage-comment.md)" > /dev/null
          fi

      - name: Fail on a coverage regression
        if: matrix.node-version == 22 && steps.ratchet.outcome != 'success'
        run: |
          echo "::error::The coverage ratchet did not pass - see the coverage comment."
          exit 1

  server-tests:
    name: server-tests
    runs-on: ubuntu-latest
    # the suite starts a server and deploys to it; a hung start must fail here
    # rather than hold a runner for the 360-minute default
    timeout-minutes: 30
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Update npm
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Install Doxygen
        run: sudo apt-get install -y doxygen

      - name: Build Project
        run: npm run build

      - name: Test Package Install
        # `sasjs cbd` below runs the packed CLI, so it is installed globally
        run: |
          npm version "5.0.0" --no-git-tag-version
          npm pack
          npm install -g ./sasjs-cli-5.0.0.tgz

      - name: Install PM2
        # pinned: a pm2 major changes `pm2 start` semantics and the process
        # listing the wait step greps, and an unpinned global install would land
        # that change on a pull request with no commit to review
        run: npm i -g pm2@7.1.1

      - name: Create .env file for sasjs/server
        run: |
          echo "RUN_TIMES=js" >> .env
          echo "NODE_PATH=node" >> .env
          echo "MOCK_SERVERTYPE=sas9" >> .env
          # sasjs/server 3.0.0 refuses to start with no listener enabled, and the
          # wait step below polls port 5000.
          echo "HTTP_PORT=5000" >> .env

      - name: Run sasjs server
        # npm channel rather than the release zip: one pinned version, so the
        # suite tests the server named here instead of whatever the latest
        # release happens to be. Bump the pin deliberately when moving the
        # tested version, which is also when a server regression should show up.
        run: pm2 start npx --name sasjs-server -- --yes @sasjs/server@${{ env.SERVER_VERSION }}

      - name: Wait for sasjs server to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf -m 5 http://localhost:5000/SASjsApi/info > /dev/null 2>&1; then
              echo "sasjs server is ready"
              exit 0
            fi
            echo "waiting for sasjs server ($i/60)..."
            sleep 5
          done
          echo "sasjs server failed to start"
          pm2 logs sasjs-server --nostream --lines 50
          exit 1

      - name: Deploy SAS9 tests
        run: |
          cd mocks
          sasjs cbd
          cd ..
          ls sasjs_root -R

      - name: Run server tests
        run: npm run test:server
        env:
          CI: true
          CLIENT: ${{ secrets.CLIENT }}
          SECRET: ${{ secrets.SECRET }}
          SAS_USERNAME: ${{ secrets.SAS_USERNAME }}
          SAS_PASSWORD: ${{ secrets.SAS_PASSWORD }}
          VIYA_SERVER_URL: ${{ secrets.VIYA_SERVER_URL }}
          SAS9_SERVER_URL: http://localhost:5000
          SASJS_SERVER_URL: http://localhost:5000
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}

  test:
    # Fan-in: the check this workflow reported before the split was "test (22)",
    # and a required status check that never resolves blocks every pull request.
    # It starts only once every job above has finished, and fails if any of them
    # did not succeed - a skipped job does not count as a pass.
    name: test
    needs: [lint, audit, docs, build-and-smoke, unit-tests, server-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        node-version: [22]
    steps:
      - name: Check every job succeeded
        run: |
          failed=0
          for result in \
            "lint=${{ needs.lint.result }}" \
            "audit=${{ needs.audit.result }}" \
            "docs=${{ needs.docs.result }}" \
            "build-and-smoke=${{ needs.build-and-smoke.result }}" \
            "unit-tests=${{ needs.unit-tests.result }}" \
            "server-tests=${{ needs.server-tests.result }}"; do
            echo "$result"
            case "$result" in
              *=success) ;;
              *) failed=1 ;;
            esac
          done
          exit $failed
